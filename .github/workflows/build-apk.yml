name: Build Open SSTP Client APK

# Указываем, когда запускать сборку
on:
  # По вашему желанию (ручной запуск) - это самый удобный способ
  workflow_dispatch:
  # Можно также настроить автоматический запуск при пуше в эту ветку, но для начала лучше вручную
  # push:
  #   branches: [ "bugfix/focus-fix-android-tv" ]

jobs:
  build:
    # Запускаем на стандартной Ubuntu
    runs-on: ubuntu-latest
    
    steps:
      # 1. Клонируем код вашего репозитория
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем JDK (требуется для сборки Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Настраиваем Android SDK (используем готовый action)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Даем права на выполнение Gradle Wrapper (важно для Linux)
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 5. Собираем Debug-версию APK
      # Команда assembleDebug создаст отладочный APK, который не требует подписи
      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --stacktrace
        # Флаг --stacktrace поможет увидеть ошибку, если сборка не удастся

      # 6. Сохраняем готовый APK как артефакт сборки
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          # Имя папки с артефактом
          name: open-sstp-client-debug-apk
          # Путь к папке, где Gradle сохраняет собранные APK
          path: app/build/outputs/apk/debug/
